[versions]
android-agp = "9.5.2"
android-jdk = "8"
android-sdk-minimum = "27"
android-sdk-compile = "36"

kotlin = "2.4.21"

kotlinx-coroutines = "1.7.3"

annotations-jspecify = "1.0.1"
annotations-jetbrains = "26.1.0"
annotations-spotbugs = "3.1.0"

okhttp = "3.12.1"
shizuku = "12.1.0"
condom = "3.0.0"

libsuperuser = "1.1.1"
materialTapTargetPrompt = "2.0.1"
apkParser = "1.0.2"

androidx-compose-bom = "2023.10.01"
androidx-core = "1.10.1"
androidx-fragment = "1.6.0"
androidx-activity = "1.8.0"
androidx-biometric = "1.0.1"
androidx-cardview = "1.0.0"
androidx-lifecycle = "2.6.1"
androidx-localbroadcastmanager = "1.1.0"
androidx-recyclerview = "1.3.0"
google-material = "1.4.0"

test-junit = "4.13.2"
test-mockito = "2.18.3"
test-androidx-test = "1.7.0"

legacy-androidx-core = "1.3.2"
legacy-test-junit = "4.12"
legacy-test-androidx-test = "1.3.0"


[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-application = { id = "com.android.application", version.ref = "android-agp" }
android-library = { id = "com.android.library", version.ref = "android-agp" }
android-builtInKotlin = { id = "com.android.built-in-kotlin", version.ref = "android-agp" }


[libraries]
kotlin-stdlib-jdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }

annotations-jspecify = { module = "org.jspecify:jspecify", version.ref = "annotations-jspecify" }
annotations-jetbrains = { module = "org.jetbrains:annotations", version.ref = "annotations-jetbrains" }
annotations-spotbugs = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "annotations-spotbugs" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-urlconnection = { group = "com.squareup.okhttp3", name = "okhttp-urlconnection", version.ref = "okhttp" }

shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

condom = { group = "com.oasisfeng.condom", name = "library", version.ref = "condom" }

libsuperuser = { group = "eu.chainfire", name = "libsuperuser", version.ref = "libsuperuser" }
materialTapTargetPrompt = { group = "uk.co.samuelwall", name = "material-tap-target-prompt", version.ref = "materialTapTargetPrompt" }
apkParser = { group = "com.jaredrummler", name = "apk-parser", version.ref = "apkParser" }

### KotlinX
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jdk8 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-jdk8", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

### AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidx-biometric" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "androidx-cardview" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "androidx-localbroadcastmanager" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }

### Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
androidx-compose-material = { group = "androidx.compose.material", name = "material" }

### Tests
test-junit = { module = "junit:junit", version.ref = "test-junit" }
test-mockito = { group = "org.mockito", name = "mockito-core", version.ref = "test-mockito" }
test-mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "test-mockito" }
test-kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
test-androidx-test = { group = "androidx.test", name = "core", version.ref = "test-androidx-test" }
test-androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "test-androidx-test" }
test-androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "test-androidx-test" }

### For backward compatibility
androidx-core-ktx-legacy = { group = "androidx.core", name = "core-ktx", version.ref = "legacy-androidx-core" }

test-junit-legacy = { module = "junit:junit", version.ref = "legacy-test-junit" }
test-androidx-test-legacy = { group = "androidx.test", name = "core", version.ref = "legacy-test-androidx-test" }
test-androidx-test-runner-legacy = { group = "androidx.test", name = "runner", version.ref = "legacy-test-androidx-test" }
test-androidx-test-rules-legacy = { group = "androidx.test", name = "rules", version.ref = "legacy-test-androidx-test" }
