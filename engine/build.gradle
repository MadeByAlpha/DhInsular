apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.oasisfeng.island.engine'

    compileSdk this.compileSdkVersion

    defaultConfig {
        minSdkVersion this.minSdkVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    kotlinOptions.jvmTarget = "1.8"

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkOnly 'NewApi'
        abortOnError false
        xmlReport false
        textReport true
        textOutput file('stdout')
    }
}

dependencies {
    implementation project(':shared')
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines
    implementation libs.androidx.core.ktx      // ShortcutShuttle

    androidTestImplementation libs.test.androidx.test.runner
    androidTestImplementation libs.test.androidx.test.rules
}