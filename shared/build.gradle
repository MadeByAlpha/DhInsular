apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.oasisfeng.island.shared'

    compileSdk this.compileSdkVersion

    defaultConfig {
        minSdkVersion this.minSdkVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            res {
                exclude '**/analytics_tracker.xml'
            }
        }
    }

    buildTypes {
        release { buildConfigField("boolean", "CRASHLYTICS_ENABLED", "true") }
        debug   { buildConfigField("boolean", "CRASHLYTICS_ENABLED", "false") }
    }

    kotlinOptions.jvmTarget = "1.8"
    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkOnly 'NewApi'
        abortOnError true
        xmlReport false
        textReport true
        textOutput file('stdout')
    }
}

dependencies {
    compileOnly project(":hidden")
    api project(':deagle')
    api libs.annotations.spotbugs
    implementation libs.annotations.jetbrains
    implementation libs.kotlin.stdlib.jdk8
    implementation libs.kotlinx.coroutines.jdk8
    implementation libs.androidx.core.ktx.legacy
    implementation libs.androidx.core.ktx
    implementation libs.condom
    implementation libs.okhttp
    implementation libs.okhttp.urlconnection
    implementation libs.apkParser

    testImplementation libs.test.junit.legacy
    testImplementation libs.test.mockito

    androidTestImplementation libs.test.junit.legacy
    androidTestImplementation libs.test.kotlinx.coroutines
    androidTestImplementation libs.test.androidx.test.legacy
    androidTestImplementation libs.test.androidx.test.runner.legacy
    androidTestImplementation libs.test.androidx.test.rules.legacy
}
